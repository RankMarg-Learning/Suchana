name: Frontend CI/CD (Docker + AWS SSH)

on:
  push:
    branches: ["main"]
    paths:
      - "web-suchana/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_REPO: ${{ vars.DOCKERHUB_FRONTEND_REPO || secrets.DOCKERHUB_FRONTEND_REPO }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./web-suchana
          file: ./web-suchana/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3001/api/v1' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://examsuchana.in' }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION || secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH and deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_REPO: ${{ env.DOCKERHUB_REPO }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: DOCKERHUB_REPO,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e

            # Sanitize inputs by stripping carriage returns, newlines, and surrounding whitespace
            RAW_REPO="${DOCKERHUB_REPO:-${{ env.DOCKERHUB_REPO }}}"
            IMAGE_REPO=$(echo "$RAW_REPO" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            DOCKERHUB_USER=$(echo "${DOCKERHUB_USERNAME:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            DOCKERHUB_PW=$(echo "${DOCKERHUB_TOKEN:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            CONTAINER_NAME="web-suchana"
            FULL_IMAGE="${IMAGE_REPO}:latest"

            echo "=== [1/6] Validating Configuration ==="
            if [ -z "$IMAGE_REPO" ]; then
              echo "❌ Error: DOCKERHUB_REPO is empty! Check GitHub Actions vars.DOCKERHUB_FRONTEND_REPO or secrets.DOCKERHUB_FRONTEND_REPO."
              exit 1
            fi
            echo "Target Image: ${FULL_IMAGE}"
            echo "Container Name: ${CONTAINER_NAME}"

            echo "=== [2/6] Authenticating with Docker Hub on EC2 ==="
            if [ -n "$DOCKERHUB_PW" ] && [ -n "$DOCKERHUB_USER" ]; then
              echo "🔑 Logging into Docker Hub as $DOCKERHUB_USER..."
              echo "$DOCKERHUB_PW" | sudo docker login -u "$DOCKERHUB_USER" --password-stdin || echo "⚠️ Docker login warning, proceeding with pull attempt..."
            else
              echo "ℹ️ No Docker Hub credentials passed; attempting unauthenticated pull."
            fi

            echo "=== [3/6] Pulling Latest Image ==="
            sudo docker pull "${FULL_IMAGE}"

            echo "=== [4/6] Replacing Container ==="
            echo "Stopping and removing existing container (if present)..."
            sudo docker stop "$CONTAINER_NAME" 2>/dev/null || true
            sudo docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

            echo "Starting new container..."
            sudo docker run -d \
              --name "$CONTAINER_NAME" \
              -p 3000:3000 \
              --restart unless-stopped \
              "${FULL_IMAGE}"

            echo "=== [5/6] Verifying Container Health ==="
            sleep 5
            CONTAINER_RUNNING="$(sudo docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME" 2>/dev/null || echo "false")"
            if [ "$CONTAINER_RUNNING" != "true" ]; then
              echo "❌ ERROR: Container failed to start or crashed on launch! Recent logs:"
              sudo docker logs --tail 50 "$CONTAINER_NAME" 2>&1 || true
              exit 1
            fi
            echo "✅ Container is up and running healthy."

            echo "=== [6/6] Cleanup & Nginx Reload ==="
            sudo docker image prune -af --filter "until=72h" 2>/dev/null || sudo docker image prune -f 2>/dev/null || true

            if command -v systemctl >/dev/null 2>&1; then
              sudo systemctl reload nginx 2>/dev/null || sudo systemctl restart nginx 2>/dev/null || true
            fi

            echo "🚀 Frontend deployment completed successfully!"
